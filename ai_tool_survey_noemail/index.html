<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- This page is edited often and read by ~70 people who each keep a tab open.
     A stale copy silently serves stale JavaScript, which looks like "the fix
     didn't deploy" -- so correctness wins over the few KB caching would save. -->
<meta http-equiv="Cache-Control" content="no-store">
<title>AI Tool Request &amp; Assessment Form</title>
<link rel="stylesheet" href="style.css" id="css">
</head>
<body>
<div class="app">
  <header class="top">
    <span class="badge-live">แบบสำรวจการใช้เครื่องมือ AI</span>
    <h1>AI Tool Request &amp; Assessment Form</h1>
    <p>กรอกแบบสำรวจเพื่อรับคำแนะนำเครื่องมือ AI ที่เหมาะกับงานของคุณ และยื่นขออนุมัติ — ไม่ต้องเข้าสู่ระบบ ใช้เวลาประมาณ 3 นาที</p>
  </header>
  <div id="root"></div>
  <footer class="disclaimer">
    ข้อมูลที่กรอกจะถูกบันทึกไว้ให้ทีมกำกับดูแลพิจารณา · <a href="admin.html">Admin</a>
  </footer>
</div>

<script>
/* Load the app's own scripts with a fresh stamp every time. GitHub Pages caches
   JS for minutes at a time, which during active development means people keep
   running yesterday's code and reporting bugs that are already fixed. Written
   with document.write on purpose: it preserves execution order, which these
   files depend on (config -> data -> engine -> api -> app). */
(function () {
  var t = Date.now();
  var files = ['config.js', 'directory.js', 'recommendation.js', 'api.js', 'app.js'];
  var css = document.getElementById('css');
  if (css) css.href = 'style.css?t=' + t;
  for (var i = 0; i < files.length; i++) {
    document.write('<script src="' + files[i] + '?t=' + t + '"><\/script>');
  }
})();
</script>
</body>
</html>
